<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ith5 工作流看板</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --page: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --agent: #2a78d6;
  --skill: #eb6834;
  --done: #0ca30c;
  --idle: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #1a1a19;
    --page: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --agent: #3987e5;
    --skill: #d95926;
    --done: #0ca30c;
    --idle: #383835;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
h1 { font-size: 17px; font-weight: 600; margin: 0; }
.conn { font-size: 12px; color: var(--muted); margin-left: auto; display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
.dot.live { background: var(--done); }
.sub { color: var(--ink-2); font-size: 12.5px; margin: 0 0 22px; }

section { margin-bottom: 26px; }
h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .04em; text-transform: uppercase; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

/* 正在运行 */
.run { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
.run:last-child { border-bottom: none; }
.pulse { width: 9px; height: 9px; border-radius: 50%; flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
.run-name { font-weight: 600; font-size: 13.5px; }
.run-detail { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-time { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; flex: none; color: #fff; }

/* task 进度 */
.feat { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.feat:last-child { border-bottom: none; }
.feat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.feat-name { font-weight: 600; font-size: 13.5px; }
.feat-count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--idle); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); border-radius: 3px; transition: width .3s; }
.tasks { margin: 8px 0 0; padding: 0; list-style: none; }
.tasks li { font-size: 12.5px; color: var(--ink-2); padding: 2px 0 2px 18px; position: relative; }
.tasks li::before { content: "○"; position: absolute; left: 2px; color: var(--muted); }
.tasks li.done::before { content: "●"; color: var(--done); }
.tasks li.done { color: var(--muted); text-decoration: line-through; }
.more { font-size: 12px; color: var(--muted); padding-left: 18px; }

/* 历史 */
.span { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
.span:last-child { border-bottom: none; }
.span-name { font-weight: 500; flex: none; }
.span-detail { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.span-time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.sess { color: var(--muted); font-size: 11.5px; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ith5 工作流看板</h1>
    <span class="conn"><span class="dot" id="dot"></span><span id="conn">连接中…</span></span>
  </header>
  <p class="sub" id="sub">实时显示当前会话正在调用的 agent / skill，以及 specs 里的 task 进度。</p>

  <section>
    <h2>正在运行</h2>
    <div class="card" id="running"><div class="empty">暂无正在运行的 agent 或 skill。</div></div>
  </section>

  <section>
    <h2>Task 进度</h2>
    <div class="card" id="features"><div class="empty">未在当前项目下找到 specs/*/tasks.md。</div></div>
  </section>

  <section>
    <h2>最近调用</h2>
    <div class="card" id="history"><div class="empty">还没有记录到调用。</div></div>
  </section>
</div>

<script>
const COLOR = { agent: 'var(--agent)', skill: 'var(--skill)' };
const el = id => document.getElementById(id);

function dur(ms) {
  if (ms == null) return '';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  return m + 'm' + String(Math.floor(s % 60)).padStart(2, '0') + 's';
}

function render(data) {
  const sessions = data.sessions || [];
  const active = sessions[0];

  // 正在运行 —— 汇总所有会话，因为可能同时开着好几个 Claude Code
  const running = [];
  for (const s of sessions) for (const sp of (s.running || [])) running.push(sp);

  const runBox = el('running');
  if (!running.length) {
    runBox.innerHTML = '<div class="empty">暂无正在运行的 agent 或 skill。</div>';
  } else {
    runBox.innerHTML = running.map(sp => `
      <div class="run">
        <span class="pulse" style="background:${COLOR[sp.kind] || 'var(--muted)'}"></span>
        <span class="kind" style="background:${COLOR[sp.kind] || 'var(--muted)'}">${esc(sp.kind)}</span>
        <span class="run-name">${esc(sp.name)}</span>
        <span class="run-detail">${esc(sp.detail || '')}</span>
        <span class="run-time">${dur(sp.duration_ms)}</span>
      </div>`).join('');
  }

  // task 进度
  const feats = data.features || [];
  const featBox = el('features');
  if (!feats.length) {
    featBox.innerHTML = '<div class="empty">未在当前项目下找到 specs/*/tasks.md。</div>';
  } else {
    featBox.innerHTML = feats.map(f => {
      const pct = f.total ? Math.round(f.done / f.total * 100) : 0;
      const shown = (f.tasks || []).slice(0, 12);
      const rest = (f.tasks || []).length - shown.length;
      return `
      <div class="feat">
        <div class="feat-head">
          <span class="feat-name">${esc(f.name)}</span>
          <span class="feat-count">${f.done}/${f.total} · ${pct}%</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <ul class="tasks">${shown.map(t =>
          `<li class="${t.done ? 'done' : ''}">${esc(t.text)}</li>`).join('')}</ul>
        ${rest > 0 ? `<div class="more">…另有 ${rest} 项</div>` : ''}
      </div>`;
    }).join('');
  }

  // 最近调用（倒序，最多 40 条）
  const hist = active ? (active.spans || []).filter(s => !s.running).slice().reverse().slice(0, 40) : [];
  const histBox = el('history');
  if (!hist.length) {
    histBox.innerHTML = '<div class="empty">还没有记录到调用。</div>';
  } else {
    const head = active ? `<p class="sess">会话 ${esc(active.id.slice(0, 8))} · ${esc(active.cwd || '')}</p>` : '';
    histBox.innerHTML = head + hist.map(sp => `
      <div class="span">
        <span class="swatch" style="background:${COLOR[sp.kind] || 'var(--muted)'}"></span>
        <span class="span-name">${esc(sp.name)}</span>
        <span class="span-detail">${esc(sp.detail || '')}</span>
        <span class="span-time">${dur(sp.duration_ms)}</span>
      </div>`).join('');
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { el('dot').classList.add('live'); el('conn').textContent = '已连接'; };
  es.onmessage = e => { try { render(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => {
    el('dot').classList.remove('live');
    el('conn').textContent = '连接断开，重连中…';
    // EventSource 自带重连；这里只更新提示。
  };
}
connect();
</script>
</body>
</html>
